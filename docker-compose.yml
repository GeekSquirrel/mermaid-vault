services:
  app:
    image: ghcr.io/geeksquirrel/mermaid-vault:${TAG:-latest}
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - BASE_URL=${BASE_URL:-}
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  app-data:
