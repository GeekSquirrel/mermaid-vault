services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mermaid-editor-backend
    restart: unless-stopped
    # 默认不暴露宿主机端口，仅容器内部网络通信。如需独立调试后端，可取消以下注释：
    # ports:
    #   - "${APP_BACKEND_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/mermaid.db
      - NODE_ENV=production
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
      - path: ./.env.production
        required: false
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - app-network

  frontend:
    build:
      context: ./mermaid-live-editor
      dockerfile: Dockerfile
    container_name: mermaid-editor-frontend
    restart: unless-stopped
    ports:
      # 仅前端暴露端口；通过 APP_FRONTEND_PORT 修改宿主机端口（默认 80）
      - "${APP_FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Backend origin used by the frontend nginx proxy (default: backend service in this network)
      - BACKEND_UPSTREAM=${BACKEND_UPSTREAM:-backend:8080}
      # Absolute API base URL baked into the frontend at runtime (leave empty for same-origin /api proxying)
      - API_BASE_URL=${API_BASE_URL:-}
    env_file:
      - path: ./.env
        required: false
      - path: ./.env.production
        required: false
    networks:
      - app-network

networks:
  app-network:
    driver: bridge



