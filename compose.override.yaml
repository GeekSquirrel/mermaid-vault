# Development overrides, merged automatically on top of compose.yaml:
#   docker compose --env-file .env.dev up
services:
  backend:
    build:
      target: builder
    # Distinct tag so dev builds never clobber prod images (same project name)
    image: mermaid-vault-backend:dev
    container_name: mermaid-vault-backend-dev
    ports:
      # Backend exposed on the host for standalone debugging (dev only)
      - "${APP_BACKEND_PORT:-8080}:8080"
    environment:
      - NODE_ENV=development
    env_file:
      - path: ./.env.dev
        required: false
    volumes:
      - ./packages/mermaid-vault-backend/src:/app/src
      - ./packages/mermaid-vault-backend/migrations:/app/migrations
    command: ["pnpm", "dev"]

  frontend:
    build:
      target: mermaid-dev
    image: mermaid-vault-frontend:dev
    container_name: mermaid-vault-frontend-dev
    ports:
      - "${APP_FRONTEND_PORT:-3000}:3000"
    environment:
      # Vite dev server proxies /api to the backend service over the Docker network
      - MERMAID_API_PROXY_TARGET=http://backend:8080
    volumes:
      - ./packages/mermaid-vault-frontend/src:/app/src
    depends_on:
      - backend
