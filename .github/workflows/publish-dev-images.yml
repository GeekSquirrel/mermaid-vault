name: Publish Dev Docker Images to GHCR

# Manual build for testing. Publishes :dev plus commit SHA tags.
# Default platform is linux/amd64 for fast iteration; arm64 can be added via input.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms (comma-separated)'
        required: false
        default: 'linux/amd64'
        type: string
      tag:
        description: 'Optional custom image tag (in addition to commit SHA and dev)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build & Publish Frontend
    uses: ./.github/workflows/build-images.yml
    with:
      image-name: ghcr.io/${{ github.repository_owner }}/mermaid-vault-frontend
      context: ./mermaid-vault-frontend
      dockerfile: ./mermaid-vault-frontend/Dockerfile
      target: mermaid
      platforms: ${{ inputs.platforms }}
      tags: |
        type=raw,value=dev
        type=sha,format=short,prefix=
        type=sha,format=long,prefix=
        type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
      cache-scope: frontend
    secrets: inherit

  backend:
    name: Build & Publish Backend
    uses: ./.github/workflows/build-images.yml
    with:
      image-name: ghcr.io/${{ github.repository_owner }}/mermaid-vault-backend
      context: ./backend
      dockerfile: ./backend/Dockerfile
      target: runner
      platforms: ${{ inputs.platforms }}
      tags: |
        type=raw,value=dev
        type=sha,format=short,prefix=
        type=sha,format=long,prefix=
        type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
      cache-scope: backend
    secrets: inherit
