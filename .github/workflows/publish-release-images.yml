name: Publish Release Docker Images to GHCR

# Automatic release build triggered by pushing a version tag (v*).
# Publishes multi-arch images (linux/amd64, linux/arm64) tagged with the
# semantic version, major.minor, and :latest.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build & Publish Frontend
    uses: ./.github/workflows/build-images.yml
    with:
      image-name: ghcr.io/${{ github.repository_owner }}/mermaid-vault-frontend
      context: ./mermaid-live-editor
      dockerfile: ./mermaid-live-editor/Dockerfile
      target: mermaid
      platforms: linux/amd64,linux/arm64
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=latest
      cache-scope: frontend
    secrets: inherit

  backend:
    name: Build & Publish Backend
    uses: ./.github/workflows/build-images.yml
    with:
      image-name: ghcr.io/${{ github.repository_owner }}/mermaid-vault-backend
      context: ./backend
      dockerfile: ./backend/Dockerfile
      target: runner
      platforms: linux/amd64,linux/arm64
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=latest
      cache-scope: backend
    secrets: inherit
