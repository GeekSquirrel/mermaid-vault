name: CI

# Continuous Integration:
# - Runs the test suite on every pull request and every v* tag push
#   (Docker Compose builds the backend-builder stage: pnpm install --frozen-lockfile,
#   tsc type-check, then the Vitest suite — the same pipeline as local `pnpm test`,
#   plus frontend checks — svelte-check type-check and vitest unit tests —
#   via `pnpm run test:frontend`).
# - Builds the full production image on every run so frontend/Dockerfile breakage
#   is caught before merging. The image is then smoke-tested in place (container
#   boots, /health, static frontend served, API CRUD against real SQLite)
#   before any publish.
# - Push events publish it to GHCR (image name lowercased by metadata-action):
#   push to main → :<short-sha> + rolling :main; push of a v* tag → :<version>
#   (raw and bare) + rolling :latest.
# - A push to main skips the test job: the content was just validated by the
#   checks of the PR that merged, so the run goes straight to build + publish.
# - Pull requests and manual dispatches build without publishing.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Docker Compose)
    # Full suite on PRs and version tags; a push to main only publishes and
    # relies on the checks of the PR that was just merged.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Host pnpm only drives the root `pnpm test` scripts (docker compose
      # commands); the toolchains live inside the test images.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Backend tests
        run: pnpm test

      - name: Frontend checks (svelte-check + unit tests)
        run: pnpm run test:frontend

  build:
    name: Production image build
    needs: test
    # also run when the test job was skipped (push to main / manual dispatch)
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the repository path, which GHCR requires
      # (GeekSquirrel/mermaid-vault → geeksquirrel/mermaid-vault).
      - name: Extract Docker metadata (branch push → :short-sha + :main)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        id: meta-branch
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=

      - name: Extract Docker metadata (version tag → :version + :latest)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        id: meta-tag
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build image (load locally)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: linux/amd64
          load: true
          tags: mermaid-vault-ci:candidate
          cache-from: type=gha,scope=ci-production-image
          cache-to: type=gha,mode=max,scope=ci-production-image
          provenance: false

      - name: Smoke test the image
        run: |
          # 18080 on the host avoids clashing with anything already listening
          docker run -d --name ci-smoke -p 127.0.0.1:18080:8080 mermaid-vault-ci:candidate
          trap 'docker rm -f ci-smoke >/dev/null 2>&1' EXIT

          # wait for boot
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then break; fi
            if [ "$i" = 30 ]; then docker logs ci-smoke; echo "container did not become healthy"; exit 1; fi
            sleep 2
          done

          # 1) health endpoint
          curl -fsS http://127.0.0.1:18080/health >/dev/null

          # 2) frontend static hosting serves the built SvelteKit app
          curl -fsS http://127.0.0.1:18080/ | grep -q "</html>"

          # 3) API CRUD against real SQLite (exercises boot migrations)
          CREATE_RES=$(curl -fsS -X POST http://127.0.0.1:18080/api/diagrams \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI smoke","code":"graph TD; A[CI] --> B[OK]"}')
          ID=$(echo "$CREATE_RES" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -z "$ID" ]; then echo "create failed: $CREATE_RES"; exit 1; fi
          curl -fsS "http://127.0.0.1:18080/api/diagrams/$ID" | grep -q '"success":true'
          curl -fsS -X DELETE "http://127.0.0.1:18080/api/diagrams/$ID" >/dev/null
          echo "smoke test passed"

      - name: Publish (push events only)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-branch.outputs.tags || steps.meta-tag.outputs.tags }}
          labels: ${{ steps.meta-branch.outputs.labels || steps.meta-tag.outputs.labels }}
          cache-from: type=gha,scope=ci-production-image
          cache-to: type=gha,mode=max,scope=ci-production-image
          provenance: false
