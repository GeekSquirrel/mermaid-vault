services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mermaid-editor-backend-dev
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/mermaid.db
      - NODE_ENV=development
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    volumes:
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations
      - ./backend/data:/app/data
    command: ["bun", "--watch", "src/index.ts"]
