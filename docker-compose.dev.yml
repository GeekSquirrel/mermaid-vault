services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: mermaid-editor-backend-dev
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-${PORT:-8080}}:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/mermaid.db
      - NODE_ENV=development
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    volumes:
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations
      - ./backend/data:/app/data
    command: ["pnpm", "dev"]

  frontend:
    build:
      context: ./mermaid-live-editor
      dockerfile: Dockerfile
      target: mermaid-dev
    container_name: mermaid-editor-frontend-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
    volumes:
      - ./mermaid-live-editor/src:/app/src
    depends_on:
      - backend


