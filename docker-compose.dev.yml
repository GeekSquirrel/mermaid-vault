services:
  backend:
    build:
      context: ./mermaid-vault-backend
      dockerfile: Dockerfile
      target: builder
    container_name: mermaid-vault-backend-dev
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-${PORT:-8080}}:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/mermaid.db
      - NODE_ENV=development
    env_file:
      - path: ./mermaid-vault-backend/.env
        required: false
      - path: ./.env
        required: false
    volumes:
      - ./mermaid-vault-backend/src:/app/src
      - ./mermaid-vault-backend/migrations:/app/migrations
      - ./mermaid-vault-backend/data:/app/data
    command: ["pnpm", "dev"]

  frontend:
    build:
      context: ./mermaid-vault-frontend
      dockerfile: Dockerfile
      target: mermaid-dev
    container_name: mermaid-vault-frontend-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # Vite dev server proxies /api to the backend service over the Docker network
      - MERMAID_API_PROXY_TARGET=http://backend:8080
    volumes:
      - ./mermaid-vault-frontend/src:/app/src
    depends_on:
      - backend


