# Common base for all stacks. Never used alone; pick a mode:
#   Development: docker compose --env-file .env.dev up
#     (compose.override.yaml is merged automatically)
#   Production:  docker compose --env-file .env.prod -f compose.yaml -f compose.prod.yaml up -d
services:
  backend:
    build:
      context: ./packages/mermaid-vault-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8080
      - DB_PATH=/app/data/mermaid.db
    volumes:
      - ./packages/mermaid-vault-backend/data:/app/data
    networks:
      - app-network

  frontend:
    build:
      context: ./packages/mermaid-vault-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
