# Pre-built GHCR image overrides — run the production stack without building.
# Usage: docker compose --env-file .env.prod -f compose.yaml -f compose.ghcr.yaml up -d
# Requires Docker Compose v2.24+ (uses the `build: !reset null` tag).
# Image channel/version comes from MERMAID_IMAGE_TAG (default: latest release,
# e.g. set MERMAID_IMAGE_TAG=dev in .env.prod for the dev channel).
services:
  backend:
    image: ghcr.io/geeksquirrel/mermaid-vault-backend:${MERMAID_IMAGE_TAG:-latest}
    build: !reset null
    container_name: mermaid-vault-backend
    environment:
      - NODE_ENV=production
      # Comma-separated origin whitelist for cross-origin API access (API_BASE_URL
      # Mode 3); leave empty to allow all origins.
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      # Set MCP_ENABLED=false in .env.prod to remove the /api/mcp endpoint for AI agents
      - MCP_ENABLED=${MCP_ENABLED:-true}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    image: ghcr.io/geeksquirrel/mermaid-vault-frontend:${MERMAID_IMAGE_TAG:-latest}
    build: !reset null
    container_name: mermaid-vault-frontend
    ports:
      # Only the frontend exposes a host port; change it via APP_FRONTEND_PORT.
      - "${APP_FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Backend origin used by the frontend nginx proxy (default: backend service in this network)
      - BACKEND_UPSTREAM=${BACKEND_UPSTREAM:-http://backend:8080}
      # Absolute API base URL baked into the frontend at runtime (leave empty for same-origin /api proxying)
      - API_BASE_URL=${API_BASE_URL:-}
